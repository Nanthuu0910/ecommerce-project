{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>
        {% block title %}
        My Website
        {% endblock %}
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <a href="{% url 'home' %}">
                <span>PROJECT</span>
            </a>
        </div>

        <div class="nav-link">
            <a href="{% url 'category' 'men' %}">
                MEN
            </a>
            <a href="{% url 'category' 'women' %}">
                WOMEN
            </a>
            <a href="{% url 'category' 'kids' %}">
                KIDS
            </a>
            
            <a href="{% url 'category' 'beauty' %}">
                BEAUTY
            </a>
            <a href="{% url 'category' 'accessories' %}">
                ACCESSORIES
            </a>

        </div>
        <div class="search-box">
            <span>⌕</span>
            <form action="{% url 'search' %}">
                <input type="text"  name='search' placeholder="Search products" >
            </form>
            

        </div>
        <div class="right-nav">
            <a href="{% url 'login' %}">
               <div class="icon">♙</div>
                <span>Login</span>
            </a>
            <a href="{% url 'allwishlist' %}">
                <div class="icon">♡</div>
                <div>Wishlist</div>
            <!-- </a> -->
            <a href="{% url 'cart' %}">
                <div class="icon">🛒 </div>
                Bag
            </a>
        </div>
    </div>
    {% block content %}
    {% endblock %}
    
</body>

</html>
