{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
<style>
    * {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}

.image-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    padding: 20px;
    justify-content: flex-start;
}

.product-card {
    width: 220px;
    background-color: #FFFFFF;
    border: 1px solid #E7D7B5;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
}

.p-image img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    display: block;
}

.p-text h4 {
    font-size: 16px;
    color: #17110E;
    margin-top: 10px;
}

.p-text p {
    font-size: 18px;
    font-weight: bold;
    color: #3A2922;
    margin-top: 5px;
}


@media (max-width: 768px) {
    .product-card {
        width: calc(50% - 10px);
    }
}

@media (max-width: 480px) {
    .product-card {
        width: 100%;
    }
}
    
</style>
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <a href="{% url 'home' %}">
                <span>PROJECT</span>
            </a>
        </div>

        <div class="nav-link">
            <a href="{% url 'category' 'men' %}">
                MEN
            </a>
            <a href="{% url 'category' 'women' %}">
                WOMEN
            </a>
            <a href="{% url 'category' 'kids' %}">
                KIDS
            </a>
           
            <a href="{% url 'category' 'beauty' %}">
                BEAUTY
            </a>
            <a href="{% url 'category' 'accessories' %}">
                ACCESSORIES
            </a>

        </div>
          <div class="search-box">
            <span>⌕</span>
            <form action="{% url 'search' %}">
                <input type="text"  name='search' placeholder="Search products" >
            </form>
        </div>
        <div class="right-nav">
            {% if user.is_authenticated %}
            <a href="{% url 'logout' %}">
                <div class="icon">logout</div>
                <span>Logout</span>
            </a>
            {% else %}
            <a href="{% url 'login' %}">
               <div class="icon">♙</div>
                <span>Login</span>
            </a>
            {% endif %}
            <!-- <a href="{% url 'login' %}">
               <div class="icon">♙</div>
                <span>Login</span>
            </a> -->
            <a href="{% url 'allwishlist' %}">
                <div class="icon">♡</div>
                <div>Wishlist</div>
            </a>
            <a href="{% url 'cart' %}">
                <div class="icon">
                    🛒
                </div>
                Cart
            </a>
        </div>

    </div>
    <div class="image-container">

    <!-- {% for p in product %}

        <div class="product-card">
            <a href="{% url 'product_detail' p.id %}">
                
            </a>

            {% if p.image %}
                <div class="p-image">
                    <img src="{{ p.image.url }}" alt="{{ p.name }}">
                </div>
            {% endif %}

            <div class="p-text">
                <h4>{{ p.name }}</h4>
                <p>₹{{ p.price }}</p>
            </div>

        </div>

    {% empty %}
        <p>No products available.</p>
    {% endfor %} -->


    {% for p in product %}

        <div class="product-card">

            <a href="{% url 'product_detail' p.id %}"
               class="product-link">

                {% if p.image %}
                    <div class="p-image">
                        <img src="{{ p.image.url }}" alt="{{ p.name }}">
                    </div>
                {% endif %}

                <div class="p-text">
                    <h4>{{ p.name }}</h4>
                    <p>₹{{ p.price }}</p>
                </div>

            </a>

        </div>

    {% empty %}
        <p>No products available.</p>
    {% endfor %}




</div>
    
</body>

</html>
