<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>Customer Orders</h1>
   {% for o in order %}
<p>{{o.cart.order_id}}</p>
<p>{{o.cart.quantity}}</p>
<p>{{o.user}}</p>
<p>{{o.cart.total}}</p>
<p>{{o.id}}</p>
{% empty %}
<p>No order</p>
   {% endfor %} 
</body>
</html>
