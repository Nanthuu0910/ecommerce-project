
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
       *{
        padding:0px;
        margin:0px;
       }
       body {
    font-family: Arial, sans-serif;
    background: #FBF7F0;
    color: #17110E;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}
       .product-form{
        padding:30px;
        margin:30px auto;
        margin-bottom: 20px;
        width:400px;
        border-radius: 20px;
        box-shadow:0 4px 8px rgba(0,0,0,0.5);

       }
       .form-label{
        font-size: 15px;
        display:block;
        margin-bottom: 8px;
        color:#3A2922;
        font-weight:bold;
       }
       .btn {
    width: 100%;
    padding: 13px;
    border: 1px solid #3A2922;
    border-radius: 6px;
    background: #3A2922;
    color: #FFFFFF;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s ease;
}

.btn:hover {
    background: #17110E; 
    border-color: #B08D57;
}
    </style>
</head>

<body>

<div class="product-form">

    <h2>Add Product</h2>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}


    <form method="POST">
        {% csrf_token %}

        <label class="form-label">Main Category</label>

        <select name="main_category" class="form-select" required>
            <option value="">Select Main Category</option>

            {% for category in categories %}
                <option value="{{ category.id }}"
                    {% if selected_category == category.id|stringformat:"s" %}
                        selected
                    {% endif %}>
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>

        <button type="submit" name="action" value="show_subcategories" class="btn ">
            Show Subcategories
        </button>
    </form>

    {% if subcategories %}

        <hr>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <input type="hidden"
                   name="main_category"
                   value="{{ selected_category }}">

            <label class="form-label">Subcategory</label>

            <select name="subcategory" class="form-select" required>
                <option value="">Select Subcategory</option>

                {% for sub in subcategories %}
                    <option value="{{ sub.id }}">
                        {{ sub.name }}
                    </option>
                {% endfor %}
            </select>

            <label class="form-label">Product Name</label>
            <input type="text" name="name" class="form-control" required>

            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4" required></textarea>

            <label class="form-label">Price</label>
            <input type="number" name="price" class="form-control" required>

            <label class="form-label">Product Image</label>
            <input type="file" name="image" class="form-control" accept="image/*" required>
 
            <button type="submit"
                    name="action"
    value="add_product" class="btn ">Add Product</button>
        </form> 

    {% elif selected_category %}
        <p class="text-danger mt-3">
            No subcategories found. Please add subcategories in Django Admin.
        </p>
    {% endif %}

</div>

</body>
</html>
